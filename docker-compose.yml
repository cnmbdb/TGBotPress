name: tgbotpress
services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: tgbotpress
      POSTGRES_USER: tgbotpress
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgbotpress -d tgbotpress"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
  platform:
    image: ${TGBOTPRESS_IMAGE:-ghcr.io/cnmbdb/tgbotpress:latest}
    container_name: platform
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: tgbotpress
      DB_USERNAME: tgbotpress
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      PLATFORM_ORIGIN: ${PLATFORM_ORIGIN:-http://127.0.0.1:8083}
      REDIS_HOST: redis
      WEBHOOK_PROXY_PORT: 8084
      MEDIA_STORAGE_ROOT: /legacy-storage
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8084:8084"
    volumes:
      - media:/legacy-storage
    restart: unless-stopped
volumes:
  postgres_data:
  media:
